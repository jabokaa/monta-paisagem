<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffcf4a">
<meta name="description" content="Monte paisagens com figurinhas e desenhe com lápis, pincel e spray.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paisagem">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Monta Paisagem</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* VOICE: alegre, brinquedo de madeira pintada, nada de texto sobrando
   IDEA: um quadro de feltro de brinquedo dentro de uma caixa amarela
   PICTURE: a própria paisagem em que a criança monta, grande, no centro
   COLOUR and TYPE: girassol + azul-anil + coral; Fredoka arredondada
   LAYOUT: paisagens no topo, ferramentas à esquerda, cena, gaveta de figurinhas embaixo */
:root{color-scheme:light dark;--bg:light-dark(#ffcf4a,#162244);--panel:light-dark(#fff7df,#22305c);--ink:light-dark(#22305c,#fff3d6);--soft:light-dark(#f3e3b3,#2e3d6b);--acc:light-dark(#ff6b57,#ffb347)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Fredoka,"Baloo 2",system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none}
.app{max-width:1240px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(2vw,10px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(2vw,10px,env(safe-area-inset-left))}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.install{flex:none;border:0;border-radius:999px;padding:10px 16px;min-height:44px;background:var(--acc);color:#fff;font:600 16px Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.install[hidden]{display:none}
header{display:flex;align-items:center;gap:16px;margin-bottom:12px}
h1{font-size:clamp(24px,3.4vw,36px);line-height:1.05;margin:0;font-weight:700;white-space:nowrap}
.lands{display:flex;gap:8px;overflow-x:auto;padding:4px;flex:1}
.land{flex:none;width:92px;border:0;padding:4px 4px 2px;border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--soft)}
.land svg{display:block;width:100%;height:52px;border-radius:10px}
.land[aria-pressed=true]{outline:4px solid var(--acc)}
.work{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.tools{background:var(--panel);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 5px 0 var(--soft)}
.grp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tb{height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.tb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.tb:focus-visible,.land:focus-visible,.it:focus-visible,.tab:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.col{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid var(--panel);cursor:pointer;box-shadow:0 0 0 2px var(--soft)}
.col[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.sz{height:36px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;border-radius:10px}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed=true]{background:var(--soft)}
hr{border:0;border-top:2px dashed var(--soft);margin:0;width:100%}
.stage{display:flex;flex-direction:column;gap:12px}
.scene{position:relative;width:min(100%,calc((100svh - 300px)*1.6));min-width:min(100%,520px);margin:0 auto;aspect-ratio:16/10;border-radius:22px;overflow:hidden;border:6px solid var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.18);container-type:inline-size;touch-action:none;background:#fff}
.scene>svg,.scene>canvas,.layer{position:absolute;inset:0;width:100%;height:100%}
canvas{pointer-events:none}
.drawing canvas{pointer-events:auto;cursor:crosshair}
.layer{pointer-events:none}
.stk{position:absolute;line-height:1;pointer-events:auto;cursor:grab;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 .35cqw .25cqw rgba(0,0,0,.28));touch-action:none}
.drawing .stk{pointer-events:none}
.sbox{position:absolute;border:.3cqw dashed #fff;box-shadow:0 0 0 .15cqw rgba(0,0,0,.35);border-radius:1cqw;pointer-events:none}
.lasso{position:absolute;border:.25cqw dashed #fff;background:rgba(255,255,255,.18);box-shadow:0 0 0 .12cqw rgba(0,0,0,.4);pointer-events:none;z-index:4}
.stk.sel{outline:.3cqw dashed #fff;outline-offset:.4cqw;border-radius:1cqw;cursor:grabbing}
.selbar{position:absolute;display:flex;gap:4px;background:var(--ink);padding:5px;border-radius:14px;pointer-events:auto;z-index:5}
.selbar button{width:40px;height:40px;border:0;border-radius:10px;background:var(--panel);color:var(--ink);font:700 20px Fredoka,sans-serif;cursor:pointer}
.selbar button.del{background:var(--acc);color:#fff}
.rot{position:absolute;width:max(36px,4.4cqw);height:max(36px,4.4cqw);border-radius:50%;background:var(--ink);color:var(--panel);border:3px solid #fff;display:grid;place-items:center;font:700 max(20px,2.4cqw)/1 Fredoka,sans-serif;transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;z-index:5;touch-action:none;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rot:active{cursor:grabbing}
.tray{background:var(--panel);border-radius:22px;padding:10px 12px 12px;box-shadow:0 5px 0 var(--soft)}
.search{width:100%;box-sizing:border-box;border:0;border-radius:999px;padding:10px 18px;margin-bottom:8px;font:500 16px Fredoka,sans-serif;background:var(--soft);color:var(--ink);min-height:44px}
.search:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.empty{grid-column:1/-1;margin:10px 4px;opacity:.7}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tab{flex:none;border:0;border-radius:999px;padding:6px 12px;font:26px/1 "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;min-width:52px;background:var(--soft);color:var(--ink);cursor:pointer;min-height:44px}
.tab[aria-pressed=true]{background:var(--acc);color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:252px;overflow-y:auto;overscroll-behavior:contain}
.it{height:54px;border:0;border-radius:14px;background:transparent;font-size:34px;cursor:grab;touch-action:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transition:transform .12s}
.it:hover{background:var(--soft);transform:scale(1.12)}
.ghost{position:fixed;z-index:50;pointer-events:none;font-size:64px;transform:translate(-50%,-50%) scale(1.1);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.hint{font-size:14px;opacity:.75;margin:6px 2px 0}
.gal{border:0;border-radius:24px;padding:0;background:var(--panel);color:var(--ink);width:min(920px,calc(100vw - 32px));max-height:calc(100svh - 40px);box-shadow:0 10px 0 rgba(0,0,0,.2)}
.gal::backdrop{background:rgba(10,15,40,.55)}
.galhd{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;position:sticky;top:0;background:var(--panel);z-index:1}
.galhd h2{margin:0;font-size:24px;flex:1}
.galhd button{width:48px;height:48px;border:0;border-radius:14px;background:var(--soft);color:var(--ink);font:700 22px Fredoka,sans-serif;cursor:pointer}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:8px 16px 18px}
.card{position:relative;background:var(--soft);border-radius:16px;padding:6px}
.card .open{display:block;width:100%;border:0;padding:0;background:#fff;border-radius:11px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;font-size:40px}
.card .open img{display:block;width:100%;height:100%;object-fit:cover}
.card .open.cur{outline:4px solid var(--acc);outline-offset:2px}
.card .when{display:block;font-size:13px;opacity:.75;padding:4px 4px 0}
.card .del{position:absolute;top:0;right:0;width:40px;height:40px;border:0;border-radius:50%;background:var(--acc);color:#fff;font:700 18px Fredoka,sans-serif;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.galempty{grid-column:1/-1;text-align:center;font-size:18px;opacity:.8;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:12px 22px;border-radius:999px;font:600 18px Fredoka,sans-serif;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tb.big{background:var(--acc);color:#fff}
@media(max-width:700px){
  header{flex-direction:column;align-items:stretch;gap:6px}.lands{flex:none}
  .install{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;padding:6px 14px;min-height:40px;font-size:15px}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{display:contents}.scene{order:1}.tray{order:3}
  .tools{flex-direction:row;flex-wrap:wrap;order:2;align-items:center;justify-content:center}
  .grp{grid-template-columns:repeat(6,40px)}.grp.cols{grid-template-columns:repeat(6,30px)}
  .tools hr{display:none}.scene{min-width:0}
}
@media(prefers-reduced-motion:reduce){.it{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Monta Paisagem</h1>
    <div class="lands" id="lands" aria-label="Paisagens"></div>
    <button class="install" id="installBtn" hidden title="Instalar o app neste aparelho">📲 Instalar</button>
  </header>
  <div class="work">
    <aside class="tools" aria-label="Ferramentas">
      <div class="grp" id="toolBtns"></div>
      <hr>
      <div class="grp cols" id="colors"></div>
      <hr>
      <div class="grp" id="sizes" style="grid-template-columns:1fr 1fr 1fr"></div>
      <hr>
      <div class="grp">
        <button class="tb" id="undo" title="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button class="tb" id="clear" title="Começar de novo"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
      <hr>
      <div class="grp">
        <button class="tb big" id="saveBtn" title="Salvar desenho" aria-label="Salvar desenho"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zM8 3v5h7V3M8 21v-7h8v7"/></svg></button>
        <button class="tb" id="galBtn" title="Meus desenhos" aria-label="Meus desenhos"><svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v12H3z"/><path d="M7 16l3-3 2 2 3-4 3 5"/></svg></button>
      </div>
    </aside>
    <div class="stage">
      <div class="scene" id="scene">
        <svg id="bg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
        <canvas id="cv" width="1600" height="1000"></canvas>
        <div class="layer" id="layer"></div>
      </div>
      <div class="tray">
        <input class="search" id="search" type="search" placeholder="🔍 Pesquisar emoji (ex.: gato, coração, chuva)" aria-label="Pesquisar emoji" autocomplete="off">
        <div class="tabs" id="tabs"></div>
        <div class="items" id="items"></div>
        <p class="hint">Arraste uma figurinha para a paisagem (ou toque nela). Use a bolinha ⟳ para girar e o lápis para desenhar.</p>
      </div>
    </div>
  </div>
</div>
<dialog class="gal" id="gal" aria-label="Meus desenhos">
  <div class="galhd"><h2>🖼️ Meus desenhos</h2><button id="galNew" title="Novo desenho" aria-label="Novo desenho">＋</button><button id="galClose" title="Fechar" aria-label="Fechar">✕</button></div>
  <div class="galgrid" id="galGrid"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=id=>document.getElementById(id);
const W=1600,H=1000;

/* ---------- paisagens (SVG) ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const sky=(p,a,b)=>`<defs><linearGradient id="${p}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#${p}s)"/>`;
const sun=(x,y)=>`<circle cx="${x}" cy="${y}" r="150" fill="#ffe680" opacity=".45"/><circle cx="${x}" cy="${y}" r="95" fill="#ffd23f"/>`;
const cloud=(x,y,k)=>`<g fill="#fff" opacity=".95" transform="translate(${x} ${y}) scale(${k})"><ellipse rx="90" ry="45"/><ellipse cx="70" cy="-25" rx="70" ry="55"/><ellipse cx="140" cy="5" rx="80" ry="40"/></g>`;
const dots=(n,s,ymax,r,fill)=>{seed=s;let o='';for(let i=0;i<n;i++)o+=`<circle cx="${(rnd()*1600)|0}" cy="${(rnd()*ymax)|0}" r="${(r*(.4+rnd())).toFixed(1)}" fill="${fill}"/>`;return o};
const waves=y=>{let d='';for(let x=0;x<1600;x+=100)d+=`M${x} ${y}q25-14 50 0t50 0`;return `<path d="${d}" stroke="#bfeaf7" stroke-width="6" fill="none" opacity=".7"/>`};
const mount=(x1,top,x2,base,fill,cap)=>{const cx=(x1+x2)/2,w=(x2-x1)/2,h=base-top,k=.2;return `<path d="M${x1} ${base}L${cx} ${top}L${x2} ${base}Z" fill="${fill}"/>`+(cap?`<path d="M${cx} ${top}L${cx-w*k} ${top+h*k}L${cx-w*k*.4} ${top+h*k*.85}L${cx} ${top+h*k*1.1}L${cx+w*k*.5} ${top+h*k*.85}L${cx+w*k} ${top+h*k}Z" fill="${cap}"/>`:'')};
const L={
  campo:{n:'Campo',d:p=>sky(p,'#6cc6ff','#d9f2ff')+sun(1330,180)+cloud(260,170,1)+cloud(820,120,.8)+`<path d="M0 600Q400 450 820 590T1600 540V1000H0Z" fill="#8bd46e"/><path d="M0 700Q520 600 1020 700T1600 680V1000H0Z" fill="#4fb153"/><path d="M0 840Q600 770 1600 850V1000H0Z" fill="#3c9a45"/>`},
  praia:{n:'Praia',d:p=>sky(p,'#5ec8f2','#e6f7ff')+sun(300,190)+cloud(1100,150,.9)+`<rect y="520" width="1600" height="260" fill="#1f9fd1"/><rect y="520" width="1600" height="50" fill="#5cc8ea"/>`+waves(620)+waves(690)+`<path d="M0 720Q400 680 800 730T1600 700V1000H0Z" fill="#f5d48a"/><path d="M0 870Q700 810 1600 890V1000H0Z" fill="#ecc272"/>`},
  montanha:{n:'Montanha',d:p=>sky(p,'#7fc8f5','#e9f6ff')+cloud(1200,140,.8)+mount(-80,260,720,650,'#7a8fb3','#fff')+mount(1050,320,1720,650,'#8ea2c4','#fff')+mount(420,170,1420,650,'#5f7499','#fff')+`<path d="M0 620Q800 560 1600 620V1000H0Z" fill="#5dbb63"/><ellipse cx="1150" cy="830" rx="300" ry="70" fill="#4aa9de"/><ellipse cx="1110" cy="815" rx="180" ry="22" fill="#8fd2f3"/>`},
  noite:{n:'Noite',d:p=>sky(p,'#0b1640','#34548f')+dots(90,3,620,4,'#fff8d6')+`<circle cx="1300" cy="200" r="150" fill="#fff6c8" opacity=".15"/><circle cx="1300" cy="200" r="90" fill="#fff3b0"/><circle cx="1270" cy="180" r="16" fill="#efe09a"/><circle cx="1325" cy="235" r="11" fill="#efe09a"/><path d="M0 640Q450 520 900 630T1600 600V1000H0Z" fill="#245a49"/><path d="M0 780Q700 690 1600 790V1000H0Z" fill="#17402f"/>`},
  neve:{n:'Neve',d:p=>sky(p,'#a9d4f0','#eef7fc')+mount(-60,300,760,680,'#c9dff0','#fff')+mount(600,220,1680,680,'#b5d0e8','#fff')+`<path d="M0 650Q800 580 1600 660V1000H0Z" fill="#fbfdff"/><path d="M0 820Q700 760 1600 840V1000H0Z" fill="#e3eff7"/>`+dots(70,11,1000,6,'#fff')},
  mar:{n:'Fundo do mar',d:p=>sky(p,'#3fc1f0','#063f7a')+[150,600,1050].map(x=>`<polygon points="${x},0 ${x+120},0 ${x+420},1000 ${x+240},1000" fill="#fff" opacity=".08"/>`).join('')+`<path d="M0 860Q500 800 900 860T1600 840V1000H0Z" fill="#e8c87a"/>`+(seed=5,Array.from({length:18},()=>`<circle cx="${(rnd()*1600)|0}" cy="${(rnd()*780)|0}" r="${(6+rnd()*14)|0}" fill="none" stroke="#e8fbff" stroke-width="3" opacity=".6"/>`).join(''))},
  espaco:{n:'Espaço',d:p=>`<rect width="1600" height="1000" fill="#070b24"/>`+dots(160,21,800,3,'#fff')+`<circle cx="1250" cy="260" r="130" fill="#ff8f5a"/><path d="M1130 230q120 30 240 0" stroke="#ffb98f" stroke-width="18" fill="none"/><ellipse cx="1250" cy="260" rx="220" ry="40" fill="none" stroke="#ffd3a8" stroke-width="10" transform="rotate(-15 1250 260)"/><path d="M0 780Q800 700 1600 790V1000H0Z" fill="#9aa0b5"/><ellipse cx="350" cy="870" rx="90" ry="22" fill="#80869c"/><ellipse cx="1100" cy="900" rx="130" ry="28" fill="#80869c"/><ellipse cx="760" cy="820" rx="50" ry="12" fill="#80869c"/>`},
  branco:{n:'Folha branca',d:()=>`<rect width="1600" height="1000" fill="#fffdf7"/>`}
};

/* ---------- figurinhas ---------- */
const CATS={
  'Casas':'🏠 🏡 🏘️ 🏰 🏯 🏫 🏥 🏪 🏬 🏢 🏭 ⛪ 🕌 🏟️ ⛺ 🛖 🗼 🌉 ⛲ 🎡 🎠 🛝 🚦 🪑',
  'Natureza':'🌳 🌲 🌴 🌵 🌷 🌻 🌹 🌼 🍄 🌾 🌿 🪨 ⛰️ 🌋 🌈 ☁️ 🌧️ ☀️ 🌙 ⭐ ❄️ 🔥 💧 🍎',
  'Animais':'🐶 🐱 🐮 🐷 🐔 🐴 🐑 🐐 🦆 🐸 🐰 🐻 🦁 🐯 🐘 🦒 🐵 🦓 🐢 🐟 🐠 🐳 🐬 🐙 🦀 🦋 🐝 🐞 🐦 🦜 🦉 🐧',
  'Pessoas':'👶 👦 👧 👨 👩 👴 👵 🧑‍🚒 👮 🧑‍🍳 🧑‍🌾 🧑‍🚀 🤴 👸 🧚 🧜',

  {k:'lapis',t:'Lápis',i:'<path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/>'},
  {k:'pincel',t:'Pincel',i:'<path d="M18 3l3 3-8 8-3-3zM10 12c-3 0-5 2-5 5 0 2-1 3-2 3 4 1 9 0 9-5"/>'},
  {k:'spray',t:'Spray',i:'<path d="M7 10h8v11H7zM9 10V7h4v3M17 5h.01M20 4h.01M19 7h.01M21 9h.01"/>'},
  {k:'borracha',t:'Borracha',i:'<path d="M3 16l9-9 7 7-5 5H7zM8 11l7 7M7 21h14"/>'},

const BASE={lapis:7,pincel:24,spray:34,borracha:44},MUL=[.5,1,2];
let S={bg:'campo',strokes:[],stickers:[]};
try{const s=JSON.parse(localStorage.getItem('monta-paisagem'));if(s&&L[s.bg])S=s}catch(e){}
let tool='mover',color='#e53935',sizeI=1,sel=new Set(),hist=[];
let lastId=0;const uid=()=>{let i=Date.now();if(i<=lastId)i=lastId+1;return lastId=i};
const fixIds=()=>S.strokes.forEach(s=>{if(s.id==null)s.id=uid()});fixIds();
const snap=()=>({bg:S.bg,gid:S.gid,strokes:S.strokes.map(o=>({...o})),stickers:S.stickers.map(o=>({...o}))});
const push=()=>{hist.push(snap());if(hist.length>60)hist.shift()};
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('monta-paisagem',JSON.stringify(S))}catch(e){}},400)};

const scene=$('scene'),layer=$('layer'),cv=$('cv'),ctx=cv.getContext('2d');

/* ---------- render ---------- */
function renderLands(){
  $('lands').innerHTML=Object.entries(L).map(([k,v])=>`<button class="land" data-k="${k}" aria-pressed="${S.bg===k}"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">${v.d('t'+k)}</svg>${v.n}</button>`).join('');
  $('bg').innerHTML=L[S.bg].d('bg');
}
function renderTools(){
  $('toolBtns').innerHTML=TOOLS.map(o=>`<button class="tb" data-k="${o.k}" title="${o.t}" aria-label="${o.t}" aria-pressed="${tool===o.k}"><svg viewBox="0 0 24 24">${o.i}</svg></button>`).join('');
  $('colors').innerHTML=COLORS.map(c=>`<button class="col" data-c="${c}" style="background:${c}" aria-label="Cor ${c}" aria-pressed="${color===c}"></button>`).join('');
  $('sizes').innerHTML=MUL.map((m,i)=>`<button class="sz" data-i="${i}" aria-label="Tamanho ${i+1}" aria-pressed="${sizeI===i}"><i style="width:${6+i*7}px;height:${6+i*7}px"></i></button>`).join('');
  scene.classList.toggle('drawing',tool!=='mover');
}
function renderTray(){
  $('tabs').innerHTML=Object.keys(CATS).map(c=>`<button class="tab" data-c="${c}" title="${c}" aria-label="${c}" aria-pressed="${!q&&c===cat}">${ICON[c]||c}</button>`).join('');
  let list=CATS[cat].split(' ');
  if(q){const t=q.split(/\s+/),seen=new Set();list=[];
    for(const c in CATS)for(const e of CATS[c].split(' ')){if(seen.has(e))continue;seen.add(e);const k=KW[e]||'';if(t.every(w=>k.includes(w)))list.push(e)}
    const sc=e=>{const n=(KW[e]||'').split(';');return n[0]===q?0:n.some(x=>x===q)?1:n[0].startsWith(q)?2:3};
    list=list.map((e,i)=>[e,sc(e),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(a=>a[0])}
  $('items').innerHTML=list.length?list.map(e=>{const n=(KW[e]||'').split(';')[0]||e;return `<button class="it" data-e="${e}" title="${n}" aria-label="${n}">${e}</button>`}).join(''):'<p class="empty">Nenhum emoji encontrado 😕</p>';
}
const stkStyle=o=>`left:${o.x}%;top:${o.y}%;font-size:${o.s}cqw;transform:translate(-50%,-50%) rotate(${o.r||0}deg) scaleX(${o.f})`;
const SW=W/100,SH=H/100;
function geo(s){if(s.g&&s!==cur)return s.g;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [x,y] of s.p){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const g={o:[(x0+x1)/2,(y0+y1)/2],b:[x0,y0,x1,y1]};if(s!==cur)s.g=g;return g}
const tf=s=>{const g=geo(s),k=s.k||1,a=(s.r||0)*Math.PI/180;return{ox:g.o[0],oy:g.o[1],dx:s.dx||0,dy:s.dy||0,kx:k*(s.f||1),ky:k,a,c:Math.cos(a),sn:Math.sin(a)}};
const toWorld=(s,x,y,t=tf(s))=>{const lx=(x-t.ox)*t.kx,ly=(y-t.oy)*t.ky;return[lx*t.c-ly*t.sn+t.ox+t.dx,lx*t.sn+ly*t.c+t.oy+t.dy]};
const toLocal=(s,x,y,t=tf(s))=>{const ux=x-t.ox-t.dx,uy=y-t.oy-t.dy;return[(ux*t.c+uy*t.sn)/t.kx+t.ox,(-ux*t.sn+uy*t.c)/t.ky+t.oy]};
function bboxOf(it){
  if(it.kind==='s'){const o=it.o,a=(o.r||0)*Math.PI/180,h=o.s*SW*.55*(Math.abs(Math.cos(a))+Math.abs(Math.sin(a)));return[o.x*SW-h,o.y*SH-h,o.x*SW+h,o.y*SH+h]}
  const st=it.o,g=geo(st),pad=st.t==='spray'?3:st.w/2,t=tf(st);
  const cs=[[g.b[0]-pad,g.b[1]-pad],[g.b[2]+pad,g.b[1]-pad],[g.b[0]-pad,g.b[3]+pad],[g.b[2]+pad,g.b[3]+pad]].map(([x,y])=>toWorld(st,x,y,t));
  const xs=cs.map(p=>p[0]),ys=cs.map(p=>p[1]);
  return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
function selItems(){const r=[];
  for(const o of S.stickers)if(sel.has('s:'+o.id))r.push({kind:'s',o});
  for(const o of S.strokes)if(sel.has('t:'+o.id))r.push({kind:'t',o});return r}
function groupBox(items){let b=[1e9,1e9,-1e9,-1e9];
  for(const it of items){const q=bboxOf(it);b=[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[2]),Math.max(b[3],q[3])]}return b}
const pruneSel=()=>{sel=new Set([...sel].filter(k=>k[0]==='s'?S.stickers.some(o=>'s:'+o.id===k):S.strokes.some(o=>'t:'+o.id===k)))};
function renderStickers(){
  const on=tool==='mover';
  layer.innerHTML=S.stickers.map(o=>`<div class="stk${on&&sel.has('s:'+o.id)?' sel':''}" data-id="${o.id}" style="${stkStyle(o)}">${o.e}</div>`).join('')+selOverlay();
}
function selOverlay(){
  if(tool!=='mover')return '';const items=selItems();if(!items.length)return '';
  let h='';
  for(const it of items)if(it.kind==='t'){const b=bboxOf(it);h+=`<div class="sbox" style="left:${b[0]/SW}%;top:${b[1]/SH}%;width:${(b[2]-b[0])/SW}%;height:${(b[3]-b[1])/SH}%"></div>`}
  const g=groupBox(items),cx=(g[0]+g[2])/2/SW,top=g[1]/SH,bot=g[3]/SH,below=top<22;
  h+=`<div class="rot" title="Arraste para girar" aria-label="Girar" style="left:clamp(22px,${g[2]/SW+1.5}%,calc(100% - 22px));top:clamp(22px,${(below?g[1]:g[3])/SH+(below?-2:2)}%,calc(100% - 22px))">⟳</div>`;
  return h+`<div class="selbar" style="left:clamp(158px,${cx}%,calc(100% - 158px));top:${Math.max(0,below?Math.min(bot,86):top)}%;transform:translate(-50%,${below?'.8cqw':'calc(-100% - .8cqw)'})">
  <button data-a="menor" title="Diminuir" aria-label="Diminuir">−</button><button data-a="maior" title="Aumentar" aria-label="Aumentar">+</button><button data-a="virar" title="Virar" aria-label="Virar">⇄</button><button data-a="girar" title="Girar" aria-label="Girar">↻</button><button data-a="copiar" title="Copiar" aria-label="Copiar">⧉</button><button data-a="frente" title="Trazer para frente" aria-label="Trazer para frente">▲</button><button data-a="apagar" class="del" title="Apagar" aria-label="Apagar">✕</button></div>`;
}
function refreshSel(){layer.querySelectorAll('.sbox,.selbar,.rot').forEach(x=>x.remove());layer.insertAdjacentHTML('beforeend',selOverlay())}
function drawStroke(s,from=1){
  ctx.globalCompositeOperation=s.t==='borracha'?'destination-out':'source-over';
  const moved=s!==cur&&(s.dx||s.dy||(s.k&&s.k!==1)||s.f===-1||s.r);
  if(moved){const t=tf(s);ctx.save();ctx.translate(t.ox+t.dx,t.oy+t.dy);ctx.rotate(t.a);ctx.scale(t.kx,t.ky);ctx.translate(-t.ox,-t.oy)}
  if(s.t==='spray'){ctx.fillStyle=s.c;for(let i=Math.max(0,from-1);i<s.p.length;i++)ctx.fillRect(s.p[i][0],s.p[i][1],2.6,2.6)}
  else{ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap=ctx.lineJoin='round';
    const p=s.p,a=Math.max(0,from-1);ctx.beginPath();ctx.moveTo(p[a][0],p[a][1]);
    if(p.length===1)ctx.lineTo(p[0][0]+.1,p[0][1]);
    for(let i=a+1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);
    ctx.stroke()}
  if(moved)ctx.restore();
}
function redraw(){ctx.clearRect(0,0,W,H);S.strokes.forEach(s=>drawStroke(s));ctx.globalCompositeOperation='source-over'}
function renderAll(){renderLands();renderTools();renderTray();renderStickers();redraw()}

/* ---------- desenho ---------- */
let cur=null;
const toCv=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]};
function sprayAt(s,[x,y]){for(let i=0;i<22;i++){const a=rnd()*6.283,d=Math.sqrt(rnd())*s.w;s.p.push([Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d)])}}
cv.addEventListener('pointerdown',e=>{
  if(tool==='mover')return;cv.setPointerCapture(e.pointerId);push();
  cur={id:uid(),t:tool,c:color,w:Math.round(BASE[tool]*MUL[sizeI]),p:[]};seed=(Date.now()%100000)+1;
  const pt=toCv(e);if(tool==='spray')sprayAt(cur,pt);else cur.p.push(pt.map(Math.round));
  S.strokes.push(cur);drawStroke(cur);
});
cv.addEventListener('pointermove',e=>{
  if(!cur)return;const n=cur.p.length,pt=toCv(e);
  if(cur.t==='spray')sprayAt(cur,pt);else{const l=cur.p[n-1];if(Math.hypot(pt[0]-l[0],pt[1]-l[1])<2)return;cur.p.push(pt.map(Math.round))}
  drawStroke(cur,cur.t==='spray'?n+1:n);
});
const endStroke=()=>{if(cur){cur=null;ctx.globalCompositeOperation='source-over';save()}};
cv.addEventListener('pointerup',endStroke);cv.addEventListener('pointercancel',endStroke);

/* ---------- selecionar e mover (figurinhas e desenhos) ---------- */
function segDist(x,y,[ax,ay],[bx,by]){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let u=l?((x-ax)*dx+(y-ay)*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(ax+u*dx-x,ay+u*dy-y)}
function hitStroke(x,y){
  for(let i=S.strokes.length-1;i>=0;i--){const st=S.strokes[i];if(st.t==='borracha')continue;
    const t=tf(st),[lx,ly]=toLocal(st,x,y,t),g=geo(st),k=Math.abs(t.ky),p=st.p;
    const tol=st.t==='spray'?st.w*.5+10/k:st.w/2+14/k;
    if(lx<g.b[0]-tol||lx>g.b[2]+tol||ly<g.b[1]-tol||ly>g.b[3]+tol)continue;
    if(st.t==='spray'){if(p.some(([px,py])=>(px-lx)**2+(py-ly)**2<tol*tol))return st;continue}
    if(p.length===1){if(Math.hypot(p[0][0]-lx,p[0][1]-ly)<tol)return st;continue}
    for(let j=1;j<p.length;j++)if(segDist(lx,ly,p[j-1],p[j])<tol)return st;
  }return null}
function duplicate(items,n=1){
  const g=groupBox(items);let ox=64*n,oy=40*n;if(g[2]+ox>W)ox=-ox;if(g[3]+oy>H)oy=-oy;
  const ns=new Set();
  for(const it of items){const id=uid();
    if(it.kind==='s'){S.stickers.push({...it.o,id,x:Math.min(100,Math.max(0,it.o.x+ox/SW)),y:Math.min(100,Math.max(0,it.o.y+oy/SH))});ns.add('s:'+id)}
    else{S.strokes.push({...it.o,id,dx:(it.o.dx||0)+ox,dy:(it.o.dy||0)+oy});ns.add('t:'+id)}}
  sel=ns;
}
const snapRot=it=>({...it,x:it.o.x,y:it.o.y,dx:it.o.dx||0,dy:it.o.dy||0,r:it.o.r||0});
const normDeg=d=>{d=((d%360)+360)%360;return d>180?d-360:d};
function rotateItems(snaps,G,deg){
  const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const rot=([x,y])=>[G[0]+(x-G[0])*c-(y-G[1])*s,G[1]+(x-G[0])*s+(y-G[1])*c];
  for(const it of snaps){
    if(it.kind==='s'){const [x,y]=rot([it.x*SW,it.y*SH]);it.o.x=Math.min(100,Math.max(0,x/SW));it.o.y=Math.min(100,Math.max(0,y/SH))}
    else{const o=geo(it.o).o,[x,y]=rot([o[0]+it.dx,o[1]+it.dy]);it.o.dx=x-o[0];it.o.dy=y-o[1]}
    it.o.r=normDeg(it.r+deg)}
}
function groupAction(a){
  const items=selItems();if(!items.length)return;
  push();
  if(a==='copiar'){duplicate(items);renderStickers();redraw();save();return}
  const g=groupBox(items),G=[(g[0]+g[2])/2,(g[1]+g[3])/2];
  const ctrOf=it=>{if(it.kind==='s')return[it.o.x*SW,it.o.y*SH];const t=tf(it.o);return[t.ox+t.dx,t.oy+t.dy]};
  const setCtr=(it,[x,y])=>{if(it.kind==='s'){it.o.x=Math.min(100,Math.max(0,x/SW));it.o.y=Math.min(100,Math.max(0,y/SH))}else{const o=geo(it.o).o;it.o.dx=x-o[0];it.o.dy=y-o[1]}};
  if(a==='menor'||a==='maior'){const up=a==='maior';let m=up?1.2:1/1.2;
    for(const it of items){const v=it.kind==='s'?it.o.s:(it.o.k||1),lo=it.kind==='s'?3:.15,hi=it.kind==='s'?32:8;m=up?Math.min(m,hi/v):Math.max(m,lo/v)}
    if(up?m<=1.01:m>=.99){hist.pop();return}
    for(const it of items){const c=ctrOf(it);setCtr(it,[G[0]+(c[0]-G[0])*m,G[1]+(c[1]-G[1])*m]);if(it.kind==='s')it.o.s*=m;else it.o.k=(it.o.k||1)*m}}
  if(a==='virar')for(const it of items){const c=ctrOf(it);setCtr(it,[2*G[0]-c[0],c[1]]);it.o.f=-(it.o.f||1);if(it.o.r)it.o.r=-it.o.r}
  if(a==='girar'||a==='girarE')rotateItems(items.map(snapRot),G,a==='girar'?45:-45);
  if(a==='frente'){const fr=(arr,p)=>[...arr.filter(o=>!sel.has(p+o.id)),...arr.filter(o=>sel.has(p+o.id))];S.stickers=fr(S.stickers,'s:');S.strokes=fr(S.strokes,'t:')}
  if(a==='apagar'){S.stickers=S.stickers.filter(o=>!sel.has('s:'+o.id));S.strokes=S.strokes.filter(o=>!sel.has('t:'+o.id));sel=new Set()}
  renderStickers();redraw();save();
}
let drag=null,lasso=null,spin=null,rafP=0;
const later=fn=>{if(!rafP)rafP=requestAnimationFrame(()=>{rafP=0;fn()})};
scene.addEventListener('pointerdown',e=>{
  if(tool!=='mover')return;
  if(e.target.closest('.rot')){
    const items=selItems();if(!items.length)return;
    e.preventDefault();scene.setPointerCapture(e.pointerId);
    const g=groupBox(items),G=[(g[0]+g[2])/2,(g[1]+g[3])/2],[x,y]=toCv(e);
    spin={G,a0:Math.atan2(y-G[1],x-G[0]),moved:false,hasT:items.some(it=>it.kind==='t'),items:items.map(snapRot)};return}
  const b=e.target.closest('.selbar button');
  if(b){e.preventDefault();groupAction(b.dataset.a);return}
  if(e.target.closest('.selbar'))return;
  e.preventDefault();scene.setPointerCapture(e.pointerId);
  const [x,y]=toCv(e),add=e.shiftKey||e.ctrlKey||e.metaKey;
  const el=e.target.closest('.stk');let key=null;
  if(el)key='s:'+el.dataset.id;else{const st=hitStroke(x,y);if(st)key='t:'+st.id}
  if(key){
    if(add&&sel.has(key)){sel.delete(key);renderStickers();return}
    if(add)sel.add(key);else if(!sel.has(key))sel=new Set([key]);
    renderStickers();
    drag={sx:x,sy:y,moved:false,items:selItems().map(it=>({...it,x:it.o.x,y:it.o.y,dx:it.o.dx||0,dy:it.o.dy||0}))};
  }else{
    if(!add)sel=new Set();
    lasso={x0:x,y0:y,x1:x,y1:y,base:new Set(sel),el:null};renderStickers();
  }
});
scene.addEventListener('pointermove',e=>{
  if(spin){const [x,y]=toCv(e);let d=(Math.atan2(y-spin.G[1],x-spin.G[0])-spin.a0)*180/Math.PI;
    if(e.shiftKey)d=Math.round(d/15)*15;else{const n=Math.round(d/90)*90;if(Math.abs(d-n)<4)d=n}
    if(!spin.moved){if(Math.abs(d)<1)return;push();spin.moved=true}
    rotateItems(spin.items,spin.G,d);
    for(const it of spin.items)if(it.kind==='s'){const el=layer.querySelector(`.stk[data-id="${it.o.id}"]`);if(el)el.style.cssText=stkStyle(it.o)}
    const hasT=spin.hasT;later(()=>{if(hasT)redraw();refreshSel()});return}
  if(drag){const [x,y]=toCv(e),dx=x-drag.sx,dy=y-drag.sy;
    if(!drag.moved){if(Math.hypot(dx,dy)<8)return;push();drag.moved=true}
    let strokes=false;
    for(const it of drag.items){
      if(it.kind==='s'){it.o.x=Math.min(100,Math.max(0,it.x+dx/SW));it.o.y=Math.min(100,Math.max(0,it.y+dy/SH));
        const el=layer.querySelector(`.stk[data-id="${it.o.id}"]`);if(el)el.style.cssText=stkStyle(it.o)}
      else{it.o.dx=it.dx+dx;it.o.dy=it.dy+dy;strokes=true}}
    later(()=>{if(strokes)redraw();refreshSel()});return}
  if(lasso){[lasso.x1,lasso.y1]=toCv(e);
    if(!lasso.el){lasso.el=document.createElement('div');lasso.el.className='lasso';layer.appendChild(lasso.el)}
    const l=lasso;Object.assign(l.el.style,{left:Math.min(l.x0,l.x1)/SW+'%',top:Math.min(l.y0,l.y1)/SH+'%',width:Math.abs(l.x1-l.x0)/SW+'%',height:Math.abs(l.y1-l.y0)/SH+'%'})}
});
const endPointer=()=>{
  if(spin){if(spin.moved){save();redraw();refreshSel()}spin=null}
  if(drag){if(drag.moved)save();drag=null}
  if(lasso){const l=lasso;lasso=null;if(l.el)l.el.remove();
    const r=[Math.min(l.x0,l.x1),Math.min(l.y0,l.y1),Math.max(l.x0,l.x1),Math.max(l.y0,l.y1)];
    if(r[2]-r[0]>8||r[3]-r[1]>8){
      const ns=new Set(l.base),hit=b=>b[0]<r[2]&&b[2]>r[0]&&b[1]<r[3]&&b[3]>r[1];
      for(const o of S.stickers)if(hit(bboxOf({kind:'s',o})))ns.add('s:'+o.id);
      for(const st of S.strokes){if(st.t==='borracha'||!hit(bboxOf({kind:'t',o:st})))continue;const t=tf(st);
        if(st.p.some(([px,py])=>{const [wx,wy]=toWorld(st,px,py,t);return wx>=r[0]&&wx<=r[2]&&wy>=r[1]&&wy<=r[3]}))ns.add('t:'+st.id)}
      sel=ns}
    renderStickers()}
};
scene.addEventListener('pointerup',endPointer);scene.addEventListener('pointercancel',endPointer);

/* ---------- gaveta: arrastar para a cena ---------- */
let tdrag=null;
$('items').addEventListener('pointerdown',e=>{
  const b=e.target.closest('.it');if(!b)return;e.preventDefault();b.setPointerCapture(e.pointerId);
  tdrag={e:b.dataset.e,sx:e.clientX,sy:e.clientY,g:null};
});
$('items').addEventListener('pointermove',e=>{
  if(!tdrag)return;
  if(!tdrag.g){if(Math.hypot(e.clientX-tdrag.sx,e.clientY-tdrag.sy)<8)return;
    tdrag.g=document.createElement('div');tdrag.g.className='ghost';tdrag.g.textContent=tdrag.e;document.body.appendChild(tdrag.g)}
  tdrag.g.style.left=e.clientX+'px';tdrag.g.style.top=e.clientY+'px';
});
let clip=null,pasteN=0;
function addSticker(e,x,y){
  push();const id=uid();
  S.stickers.push({id,e,x,y,s:9,f:1});sel=new Set(['s:'+id]);
  if(tool!=='mover'){tool='mover';renderTools()}
  renderStickers();save();
}
$('items').addEventListener('pointerup',e=>{
  if(!tdrag)return;const t=tdrag;tdrag=null;
  if(!t.g){addSticker(t.e,35+Math.random()*30,45+Math.random()*25);return}
  t.g.remove();const r=scene.getBoundingClientRect();
  if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)
    addSticker(t.e,(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);
});
$('items').addEventListener('pointercancel',()=>{if(tdrag&&tdrag.g)tdrag.g.remove();tdrag=null});
$('items').addEventListener('keydown',e=>{const b=e.target.closest('.it');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();addSticker(b.dataset.e,50,60)}});

/* ---------- botões ---------- */
$('lands').addEventListener('click',e=>{const b=e.target.closest('.land');if(!b||b.dataset.k===S.bg)return;push();S.bg=b.dataset.k;renderLands();save()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){cat=b.dataset.c;q='';$('search').value='';renderTray();$('items').scrollTop=0}});
$('search').addEventListener('input',e=>{q=e.target.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();renderTray();$('items').scrollTop=0});
$('toolBtns').addEventListener('click',e=>{const b=e.target.closest('.tb');if(b){tool=b.dataset.k;renderTools();renderStickers()}});
$('colors').addEventListener('click',e=>{const b=e.target.closest('.col');if(!b)return;color=b.dataset.c;if(tool==='mover'||tool==='borracha')tool='lapis';renderTools();renderStickers()});
$('sizes').addEventListener('click',e=>{const b=e.target.closest('.sz');if(b){sizeI=+b.dataset.i;renderTools()}});
function undo(){const s=hist.pop();if(!s)return;S=s;pruneSel();renderLands();renderStickers();redraw();save()}
$('undo').addEventListener('click',undo);
$('clear').addEventListener('click',()=>{if(!S.strokes.length&&!S.stickers.length)return;push();S.strokes=[];S.stickers=[];S.gid=null;sel=new Set();renderStickers();redraw();save()});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')||$('gal').open)return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey,has=tool==='mover'&&selItems().length>0;
  const toMover=()=>{if(tool!=='mover'){tool='mover';renderTools()}};
  if(mod&&k==='z'){e.preventDefault();undo()}
  if(mod&&k==='a'){e.preventDefault();toMover();sel=new Set([...S.stickers.map(o=>'s:'+o.id),...S.strokes.filter(st=>st.t!=='borracha').map(st=>'t:'+st.id)]);renderStickers()}
  if(mod&&k==='c'&&has){clip=selItems().map(it=>({kind:it.kind,o:{...it.o}}));pasteN=0;toast('Copiado 📋')}
  if(mod&&k==='d'&&has){e.preventDefault();push();duplicate(selItems());renderStickers();redraw();save()}
  if(mod&&k==='v'&&clip){e.preventDefault();push();pasteN++;toMover();duplicate(clip,pasteN);renderStickers();redraw();save()}
  if(!mod&&k==='r'&&has){e.preventDefault();groupAction(e.shiftKey?'girarE':'girar')}
  if((e.key==='Delete'||e.key==='Backspace')&&has){e.preventDefault();groupAction('apagar')}
  if(e.key==='Escape'&&sel.size){sel=new Set();renderStickers()}
});

/* ---------- galeria (salvo só neste navegador, via IndexedDB) ---------- */
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('monta-paisagem-galeria',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
DB.catch(()=>{});
const tx=(mode,fn)=>DB.then(db=>new Promise((ok,no)=>{const t=db.transaction('d',mode),r=fn(t.objectStore('d'));
  t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)}));
const dbAll=()=>tx('readonly',st=>st.getAll()),dbPut=o=>tx('readwrite',st=>st.put(o)),dbDel=id=>tx('readwrite',st=>st.delete(id));
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
function thumb(){return new Promise(ok=>{
  const tw=480,th=300,c=document.createElement('canvas');c.width=tw;c.height=th;const g=c.getContext('2d');
  const fin=()=>{g.drawImage(cv,0,0,tw,th);g.textAlign='center';g.textBaseline='middle';
    for(const o of S.stickers){const px=o.s/100*tw;g.save();g.translate(o.x/100*tw,o.y/100*th);g.rotate((o.r||0)*Math.PI/180);g.scale(o.f,1);
      g.font=`${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;g.fillText(o.e,0,px*.06);g.restore()}
    try{ok(c.toDataURL('image/jpeg',.82))}catch(e){ok('')}};
  const img=new Image();img.onload=()=>{g.drawImage(img,0,0,tw,th);fin()};img.onerror=()=>{g.fillStyle='#fff';g.fillRect(0,0,tw,th);fin()};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="${tw}" height="${th}" preserveAspectRatio="xMidYMid slice">${L[S.bg].d('th')}</svg>`);
})}
async function saveDrawing(){
  if(!S.strokes.length&&!S.stickers.length){toast('Desenhe alguma coisa primeiro ✏️');return}
  const b=$('saveBtn');b.disabled=true;const old=S.gid,id=old||Date.now();
  try{await dbPut({id,t:Date.now(),img:await thumb(),data:{bg:S.bg,strokes:S.strokes,stickers:S.stickers}});
    S.gid=id;save();toast(old?'Desenho atualizado! ✅':'Desenho salvo! ✅')}
  catch(e){toast('Não consegui salvar 😕')}
  b.disabled=false;
}
const fmt=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
async function renderGal(){
  let list;try{list=(await dbAll()).sort((a,b)=>b.t-a.t)}catch(e){$('galGrid').innerHTML='<p class="galempty">Este navegador não deixou guardar desenhos 😕</p>';return}
  $('galGrid').innerHTML=list.length?list.map(d=>`<div class="card"><button class="open${d.id===S.gid?' cur':''}" data-id="${d.id}" title="Abrir desenho" aria-label="Abrir desenho de ${fmt(d.t)}">${d.img?`<img src="${d.img}" alt="">`:'🖼️'}</button><span class="when">${fmt(d.t)}</span><button class="del" data-id="${d.id}" title="Apagar desenho" aria-label="Apagar desenho de ${fmt(d.t)}">✕</button></div>`).join('')
    :'<p class="galempty">Nenhum desenho salvo ainda.<br>Toque no 💾 para guardar o seu! 🎨</p>';
}
$('saveBtn').addEventListener('click',saveDrawing);
$('galBtn').addEventListener('click',()=>{renderGal();$('gal').showModal()});
$('galClose').addEventListener('click',()=>$('gal').close());
$('gal').addEventListener('click',e=>{if(e.target===$('gal'))$('gal').close()});
$('galNew').addEventListener('click',()=>{push();S={bg:S.bg,gid:null,strokes:[],stickers:[]};sel=new Set();renderLands();renderStickers();redraw();save();$('gal').close()});
$('galGrid').addEventListener('click',async e=>{
  const del=e.target.closest('.del'),op=e.target.closest('.open');
  if(del){if(!confirm('Apagar este desenho?'))return;const id=+del.dataset.id;await dbDel(id).catch(()=>{});if(S.gid===id){S.gid=null;save()}renderGal();return}
  if(op){const list=await dbAll().catch(()=>[]);const d=list.find(x=>x.id===+op.dataset.id);if(!d)return;
    push();S={bg:L[d.data.bg]?d.data.bg:'campo',gid:d.id,strokes:d.data.strokes.map(o=>({...o})),stickers:d.data.stickers.map(o=>({...o}))};fixIds();
    sel=new Set();renderLands();renderStickers();redraw();save();$('gal').close();toast('Desenho aberto! 🎨')}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveDrawing()}});

renderAll();
}
</script>

/* app instalável: funciona sem internet e mostra o botão "Instalar" quando o navegador permite */
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
{let ev=null;const b=document.getElementById('installBtn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.hidden=false});
b.addEventListener('click',async()=>{if(!ev)return;ev.prompt();await ev.userChoice.catch(()=>{});ev=null;b.hidden=true});
addEventListener('appinstalled',()=>{b.hidden=true});}
